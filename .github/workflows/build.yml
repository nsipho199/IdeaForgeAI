name: IdeaForgeAI CI

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Install Android SDK components
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" 2>/dev/null || true
          echo "SDK ready"

      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1

      - name: Run unit tests
        if: always()
        run: ./gradlew app:testDebugUnitTest --no-daemon --stacktrace 2>&1 || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ideaforge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Copy APK with clean name
        run: |
          cp app/build/outputs/apk/debug/*.apk IdeaForgeAI.apk
          ls -lh IdeaForgeAI.apk

      - name: Create Release and upload raw APK
        run: |
          # Delete existing 'latest' release if it exists
          existing=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/latest" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null)
          if [ -n "$existing" ]; then
            echo "Deleting existing release $existing"
            curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$existing"
          fi
          # Delete existing tag if present
          curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/latest" 2>/dev/null || true
          # Create new release
          create_resp=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"latest\",\"name\":\"Latest Build\",\"body\":\"Auto-built APK from master@${{ github.sha }}\",\"prerelease\":true,\"make_latest\":true}" \
            "https://api.github.com/repos/${{ github.repository }}/releases")
          release_id=$(echo "$create_resp" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null)
          echo "Release ID: $release_id"
          if [ -n "$release_id" ]; then
            # Upload the APK as a raw asset (not zipped)
            curl -s -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary @IdeaForgeAI.apk \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/$release_id/assets?name=IdeaForgeAI.apk"
            echo ""
            echo "APK uploaded to release"
          else
            echo "Failed to create release: $create_resp"
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/
            **/build/outputs/
          if-no-files-found: ignore
          retention-days: 3