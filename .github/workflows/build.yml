name: IdeaForgeAI CI

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Install Android SDK components
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" 2>/dev/null || true
          echo "SDK ready"

      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1

      - name: Run unit tests
        if: always()
        run: ./gradlew app:testDebugUnitTest --no-daemon --stacktrace 2>&1 || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ideaforge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Copy APK with clean name
        run: |
          cp app/build/outputs/apk/debug/*.apk IdeaForgeAI.apk
          ls -lh IdeaForgeAI.apk

      - name: Publish raw APK as release asset
        run: |
          python3 << 'PYEOF'
import urllib.request, json, os

token = os.environ.get('GITHUB_TOKEN', '')
repo = os.environ.get('GITHUB_REPOSITORY', 'nsipho199/IdeaForgeAI')
sha = os.environ.get('GITHUB_SHA', '')
apk_path = 'IdeaForgeAI.apk'

if not os.path.exists(apk_path):
    print(f"APK not found: {apk_path}")
    exit(1)

print(f"APK size: {os.path.getsize(apk_path)} bytes")
print(f"Token length: {len(token)}")

def api(method, url, data=None, file_path=None):
    headers = {'Authorization': f'token {token}'}
    if file_path:
        headers['Content-Type'] = 'application/vnd.android.package-archive'
        with open(file_path, 'rb') as f:
            req = urllib.request.Request(url, data=f.read(), headers=headers, method=method)
    elif data is not None:
        headers['Content-Type'] = 'application/json'
        req = urllib.request.Request(url, data=json.dumps(data).encode(), headers=headers, method=method)
    else:
        req = urllib.request.Request(url, headers=headers, method=method)
    try:
        resp = urllib.request.urlopen(req, timeout=30)
        return json.loads(resp.read())
    except urllib.error.HTTPError as e:
        body = e.read().decode(errors='replace')[:500]
        print(f"HTTP {e.code}: {body}")
        return None

# Delete existing tag
api('DELETE', f'https://api.github.com/repos/{repo}/git/refs/tags/latest')

# Create release
release = api('POST', f'https://api.github.com/repos/{repo}/releases', {
    'tag_name': 'latest',
    'name': 'Latest Build',
    'body': f'Auto-built APK from master@{sha[:7]}',
    'prerelease': True,
    'make_latest': True
})

if release and release.get('id'):
    rid = release['id']
    print(f"Release created: {rid}")
    # Upload APK
    upload_url = f'https://uploads.github.com/repos/{repo}/releases/{rid}/assets?name=IdeaForgeAI.apk'
    result = api('POST', upload_url, file_path=apk_path)
    if result:
        print(f"APK uploaded: {result.get('browser_download_url', '?')}")
    else:
        print("Upload failed")
else:
    print("Release creation failed")
PYEOF

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/
            **/build/outputs/
          if-no-files-found: ignore
          retention-days: 3